<details class="group {{ include.class }}">
  <summary
    class="relative block cursor-pointer list-none group-open:hidden [&::-webkit-details-marker]:hidden"
    aria-label="Play video: {{ include.title }}"
  >
    <img
      class="aspect-video w-full object-cover"
      src="https://i.ytimg.com/vi/{{ include.id }}/maxresdefault.jpg"
      alt=""
    >
    <svg
      class="absolute inset-0 m-auto size-16 sm:size-24 text-amber-50 drop-shadow-lg"
      viewBox="0 0 32 32"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="m11.167 5.608 16.278 8.47a2.169 2.169 0 0 1 .011 3.838l-.012.006-16.278 8.47a2.167 2.167 0 0 1-3.167-1.922V7.529a2.167 2.167 0 0 1 3.047-1.981l-.014-.005.134.065z"/>
    </svg>
  </summary>
  <iframe
    class="aspect-video w-full block"
    src="https://www.youtube.com/embed/{{ include.id }}?autoplay=1"
    title="{{ include.title }}"
    loading="lazy"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
</details>
